services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: megasena
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./server/data/megasena.csv:/docker-entrypoint-initdb.d/megasena.csv:ro
      - ./server/data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/postgresql/data
    networks:
      - appnet

  server:
    build: ./server
    environment:
      PORT: 3001
      BD_HOST: db
      BD_USER: postgres
      BD_PASSWORD: postgres
      BD_DATABASE: megasena
      BD_PORT: 5432
    depends_on:
      - db
    ports:
      - "3001:3001"
    networks:
      - appnet

  front:
    build: ./front
    depends_on:
      - server
    ports:
      - "3002:4173"
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
