<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherApp | Consulta do Clima</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="app-shell">
      <section class="hero-card" aria-labelledby="app-title">
        <div class="hero-copy">
          <span class="eyebrow">OpenWeatherMap em tempo real</span>
          <h1 id="app-title">Clima com leitura rápida, visual e precisa.</h1>
          <p>
            Consulte temperatura, sensação térmica, umidade e condição do céu em qualquer cidade
            do mundo.
          </p>
        </div>

        <form class="search-panel" id="weather-form" novalidate>
          <label for="city-input">Cidade</label>
          <div class="search-control">
            <input
              id="city-input"
              name="city"
              type="text"
              autocomplete="off"
              placeholder="Ex.: São Paulo"
              aria-describedby="status-message"
            />
            <button type="submit" id="search-button">
              <span>Buscar</span>
            </button>
          </div>
          <p class="helper-text">Dica: use cidade e país para mais precisão, como Lisboa, PT.</p>
        </form>

        <div class="quick-cities" aria-label="Sugestões de cidades">
          <button type="button" data-city="São Paulo">São Paulo</button>
          <button type="button" data-city="Rio de Janeiro">Rio de Janeiro</button>
          <button type="button" data-city="Curitiba">Curitiba</button>
          <button type="button" data-city="Tokyo">Tokyo</button>
        </div>
      </section>

      <section class="result-zone" aria-live="polite">
        <div class="status-message" id="status-message">
          Digite uma cidade para ver o clima atual em tempo real.
        </div>
        <div class="weather-card hidden" id="weather-card"></div>
      </section>
    </main>
  </body>
</html>
