<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Compras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Lista de Compras</h1>
      <form id="form-adicionar">
        <input type="text" id="nome-item" placeholder="Nome do item" required>
        <input type="text" id="valor-item" placeholder="R$ 0,00" inputmode="decimal">
        <input type="number" id="quantidade-item" placeholder="Qtd" min="1" value="1">
        <button type="submit">Adicionar</button>
      </form>
    </header>

    <table class="tabela-produtos">
      <thead>
        <tr>
          <th></th>
          <th>Nome do produto</th>
          <th>Valor</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="lista-itens"></tbody>
    </table>

    <p id="mensagem" class="mensagem"></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
