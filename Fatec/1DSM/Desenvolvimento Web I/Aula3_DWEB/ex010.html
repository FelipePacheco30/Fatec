<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Exercício 10</title>
    <style>
      * {
        font-family: calibri;
      }
      .fds > span {
        color: red;
      }
      .fds > ul {
        font-weight: bold;
      }
      .normal > ul,
      .normal > ol {
        font-style: italic;
      }
      .item:hover {
        background-color: rgb(9, 117, 9);
      }
    </style>
  </head>
  <body>
    <h3>Agenda</h3>
    <div>
      <ol>
        <li class="fds">
          <span>Domingo</span>
          <ul type="square">
            <li class="item">Ir no parque</li>
            <li class="item">Futebol</li>
          </ul>
        </li>
        <li class="normal">
          Segunda-feira
          <ol type="i">
            <li class="item">Reunião</li>
            <li class="item">Cliente</li>
          </ol>
        </li>
        <li class="normal">Terça-feira</li>
        <li class="normal">Quarta-feira</li>
        <li class="normal">
          Quinta-feira
          <ul type="square">
            <li class="item">Dentista</li>
            <li class="item">Mercado</li>
          </ul>
        </li>
        <li class="normal">Sexta-feira</li>
        <li class="fds">
          <span>Sábado</span>
          <ul type="square">
            <li class = "item">Cinema</li>
          </ul>
        </li>
      </ol>
    </div>
  </body>
</html>
