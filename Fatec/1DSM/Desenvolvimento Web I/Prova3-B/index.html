<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro de Usuário</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <main class="form-container">
    <h1>Cadastro de Pessoa</h1>
    <form id="cadastro-form" action="#" method="POST" novalidate>
      
      <div class="form-group">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required />
        <small class="feedback"></small>
      </div>
      
      <div class="form-group">
        <label for="email">E‑mail</label>
        <input type="email" id="email" name="email" required />
        <small class="feedback"></small>
      </div>
      
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required minlength="8" />
        <small class="feedback"></small>
      </div>
      
      <div class="form-group">
        <label for="confirma">Confirmação de senha</label>
        <input type="password" id="confirma" name="confirma" required />
        <small class="feedback"></small>
      </div>

      <button type="submit" id="btn-submit">Cadastrar</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
