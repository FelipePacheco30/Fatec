<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Exercício 3</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0px;
        height: 100vh;
      }
      @media (max-width: 800px) {
        .container {
          display: flex;
          flex: 1; /* ocupa toda a altura/largura disponível */
          flex-direction: column; /* utilize column para testar o layout na coluna */
        }
      }
      .um {
        flex: 1;
        font-size: 30px;
        background-color: lightyellow;
      }
      .dois {
        flex: 1;
        font-size: 30px;
        background-color: lightgreen;
      }
      .tres {
        flex: 1;
        font-size: 30px;
        background-color: lightcoral;
      }
      .container{
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="um">A</div>
      <div class="dois">B</div>
      <div class="tres">C</div>
    </div>
  </body>
</html>
