<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Exercício 4</title>
    <style>
      html {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        font-family: calibri;
      }
      body {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
      }
      #menu {
        flex: 1 70px;
        width: 100vw;
        border-bottom: 1px solid #aaa;
        box-sizing: border-box;
        text-align: left;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #menu > img {
        margin-left: 10px;
      }
      #corpo {
        flex: 100;
        width: 100vw;
        background-color: #444;
      }
      #rodape {
        flex: 2 80px;
        width: 100vw;
        border-top: 1px solid #aaa;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: space-around;
      }
      #titulo {
        display: flex;
      }
      #avatar{
        display: flex;
        align-items: center;
      }
      #titulo > div {
        font-weight: bold;
        font-size: 40px;
      }
      #avatar > div {
        font-weight: bold;
        font-size: 18px;
        margin-right: 10px;
      }
      #avatar  img {
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <div id="menu">
      <div id="titulo">
        <img src="./imagens/css.png" alt="" width="60" height="60" />
        <div>CSS3</div>
      </div>
      <div id="avatar">
        <div>Bill Gates</div>
        <img src="./imagens/avatar.jpg" alt="" width="42" height="42" />
      </div>
    </div>
    <div id="corpo"></div>
    <div id="rodape">
      <img src="./imagens/Fatec.png" alt="" width="87" height="41" />
      <img src="./imagens/CPS.png" alt="" width="85" height="56" />
      <img src="./imagens/Brasao.png" alt="" width="81" height="54" />
    </div>
  </body>
</html>
