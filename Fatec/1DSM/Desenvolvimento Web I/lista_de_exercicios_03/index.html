<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="index.js" defer></script>
  <title>Lista de Exercícios 03</title>
</head>

<body>
  <div class="container">
    <h1>Lista de Exercícios 03</h1>

    <section id="ex01">
      <h2>Exercício 1: Contar de 1 a 15</h2>
      <button onclick="contar()">Contar</button>
      <div id="resultado1">&nbsp;</div>
    </section>

    <section id="ex02">
      <h2>Exercício 2: Contar de 15 a 1</h2>
      <button onclick="contarContrario()">Contar Decrescente</button>
      <div id="resultado2">&nbsp;</div>
    </section>

    <section id="ex03">
      <h2>Exercício 3: Tabuada</h2>
      <label for="numeroTabuada">Número inteiro positivo:</label>
      <input type="number" id="numeroTabuada" min="0" placeholder="Ex: 5" />
      <button onclick="gerarTabuada()">Gerar Tabuada</button>
      <div id="resultado3">&nbsp;</div>
    </section>

    <section id="ex04">
      <h2>Exercício 4: Mudar cor de fundo</h2>
      <label for="selectCor">Escolha uma cor:</label>
      <select id="selectCor" onchange="mudarCor(this.value)">
        <option value="">-- selecione --</option>
        <option value="#e0f7fa">Azul claro</option>
        <option value="#e8f5e9">Verde claro</option>
        <option value="#fce4ec">Rosa claro</option>
        <option value="#fffde7">Amarelo claro</option>
        <option value="#ffffff">Branco</option>
      </select>
    </section>
  </div>
